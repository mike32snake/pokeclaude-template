# The whole check: no install step, because there are no dependencies.
# `npm test` runs tools/prepare.js first, which seeds config/repos.json from the
# example and builds the field layouts the suite reads.
name: test
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20.x', '22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
